; WoS Symbiote Rage settings. Changes apply the next time the game starts.
[Rage]
; Key that starts Rage: a letter or digit (R), or F1-F12.
ActivationKey=R
; Seconds Rage lasts.
RageSeconds=20
; Switch to the black suit automatically when Rage is started in the red suit (1 = yes, 0 = no).
AutoBlackSuit=1
; Pause after the suit change before Rage starts.
SuitSettleSeconds=0.6
; Standing activation: the SM3 head-grab clip plays for this many seconds.
IntroClip=bs3fidgit_2
IntroSeconds=3.5
; How long the tendrils take to grow during the head grab.
IntroGrowSeconds=2.5
; Below this speed (m/s) Spider-Man counts as standing and the head grab plays.
StillSpeed=0.6
; Hold the left mouse button this long during Rage to switch to Tendril Whip (0 = off).
WhipHoldSeconds=0.25
; While held, a new Tendril Whip is started this often.
WhipRepeatSeconds=0.45
